<div class="face-snap-card">
  <h2>{{ faceSnap.title }}</h2>
  @if (faceSnap.location) {
    <em>{{ faceSnap.location }}</em>
  } @else {
    <em>Localisation inconnue</em>
  }
  <img [src]="faceSnap.imageUrl" [alt]="faceSnap.title" />
  <p>{{ faceSnap.description }}</p>
  <p>FaceSnap créée le {{ faceSnap.createdAt }}</p>
  <p>
    <button (click)="toggleSnap()">{{ snapButtonText }}</button>
    <span [ngStyle]="{ fontWeight: 'bold', color: 'rgb(0, ' + faceSnap.snaps +', 0)' }">🤌 {{ faceSnap.snaps }}</span>
  </p>
</div>
